<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Portafolio - Milena Loor</title>

<body>

  <!-- El encabezado principal con mi presentación -->

      <p>Me apasiona la eduación inicial, me gusta la bases de datos y relacionarme con gente, conocer siempre a gente nueva.</p>
      <!-- Botón de contacto que luego se puede linkear a un mail o WhatsApp -->
      <a href="https://wa.me/593963159610?text=Hola,%20me%20gustó%20tu%20portafolio%20web" target="_blank" class="boton-contacto">Contactar</a>
    </section>

    <!-- La lista de habilidades usando flexbox para que quede horizontal -->

      <h2>Mis Habilidades</h2>
      <ul class="habilidades">
        <li>Python básico</li>
        <li>SQL Server</li>
        <li>Git & GitHub</li>
      </ul>
    </section>

  </main>

</body>
</html>
